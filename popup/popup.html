<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <style>
      :root {
        --bg-color: #ffffff;
        --text-color: #333333;
        --secondary-text-color: #666666;
        --btn-bg: #f8f9fa;
        --btn-hover-bg: #e2e6ea;
        --btn-border: #ccc;
        --accent-color: #0066cc;
        --border-radius: 8px;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg-color: #1e1e1e;
          --text-color: #e0e0e0;
          --secondary-text-color: #b0b0b0;
          --btn-bg: #2d2d2d;
          --btn-hover-bg: #3d3d3d;
          --btn-border: #444;
          --accent-color: #4ea8ff;
        }
      }

      body { 
        width: 360px; 
        padding: 20px; 
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-color);
        transition: background-color 0.3s, color 0.3s;
      }
      
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
      }

      h2 {
        margin: 0;
        color: var(--text-color);
        font-weight: 600;
        font-size: 1.25rem;
      }

      .icon-btn {
        background: none;
        border: none;
        cursor: pointer;
        padding: 8px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background-color 0.2s, color 0.2s;
        color: var(--secondary-text-color);
      }

      .icon-btn span {
        display: inline-block;
        font-size: 20px;
        line-height: 1;
        transition: transform 0.1s;
      }

      .icon-btn:hover {
        background-color: var(--btn-hover-bg);
        color: var(--text-color);
      }

      .icon-btn:hover span {
        animation: spin 2s linear infinite;
      }

      .icon-btn:active span {
        transform: scale(0.9);
      }

      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      .mode-btn { 
        width: 100%; 
        padding: 12px; 
        margin-bottom: 10px; 
        cursor: pointer; 
        border-radius: var(--border-radius); 
        border: 1px solid var(--btn-border); 
        background-color: var(--btn-bg);
        color: var(--text-color);
        font-size: 14px;
        font-weight: 500;
        transition: background-color 0.2s, border-color 0.2s, transform 0.1s;
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 10px;
      }

      .mode-btn:hover { 
        background-color: var(--btn-hover-bg); 
        border-color: var(--accent-color);
      }

      .mode-btn:active {
        transform: scale(0.98);
      }

      #output { 
        margin-top: 15px; 
        font-size: 14px; 
        line-height: 1.6; 
        color: var(--text-color);
        background: var(--btn-bg);
        padding: 12px;
        border-radius: var(--border-radius);
        min-height: 60px;
        border: 1px solid var(--btn-border);
        overflow-y: auto;
        max-height: 400px;
      }

      #output h1, #output h2, #output h3 {
        margin-top: 16px;
        margin-bottom: 8px;
        font-weight: 600;
        line-height: 1.25;
        color: var(--text-color);
      }

      #output h1 { font-size: 1.2em; border-bottom: 1px solid var(--btn-border); padding-bottom: 4px; }
      #output h2 { font-size: 1.1em; }
      #output h3 { font-size: 1.0em; }

      #output p { margin-bottom: 10px; }

      #output code {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        background-color: rgba(175, 184, 193, 0.2);
        padding: 0.2em 0.4em;
        border-radius: 6px;
        font-size: 85%;
      }

      #output .code-block-container {
        margin: 12px 0;
        border-radius: 6px;
        overflow: hidden;
        border: 1px solid var(--btn-border);
        background-color: #0d1117; /* Dark background for code blocks */
      }

      #output .code-block-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 4px 12px;
        background-color: #161b22;
        border-bottom: 1px solid var(--btn-border);
        font-size: 12px;
        color: #8b949e;
      }

      #output .copy-code-btn {
        background: none;
        border: 1px solid #30363d;
        border-radius: 4px;
        color: #8b949e;
        cursor: pointer;
        padding: 2px 8px;
        font-size: 11px;
        transition: all 0.2s;
      }

      #output .copy-code-btn:hover {
        color: #c9d1d9;
        background-color: #30363d;
      }

      #output .copy-code-btn.success {
        color: #3fb950;
        border-color: #3fb950;
      }

      #output pre {
        margin: 0;
        padding: 12px;
        overflow-x: auto;
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        font-size: 13px;
        line-height: 1.45;
        color: #e6edf3;
      }

      #output pre code {
        background-color: transparent;
        padding: 0;
        border-radius: 0;
        font-size: inherit;
        color: inherit;
        white-space: pre;
      }

      #output ul, #output ol {
        padding-left: 20px;
        margin-bottom: 10px;
      }

      #output li { margin-bottom: 4px; }
    </style>
  </head>
  <body>
    <div class="header">
      <h2>LeetCoach</h2>
      <button id="open-settings" class="icon-btn" title="Settings">
        <span>&#9881;</span>
      </button>
    </div>
    
    <button id="btn-tutor" class="mode-btn">🧠 Step-by-Step Tutor</button>
    <button id="btn-interview" class="mode-btn">👔 Mock Interviewer</button>
    <button id="btn-solution" class="mode-btn">💡 Direct Solution</button>
    
    <div id="output">
      <div id="output-content">Waiting for action...</div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
