<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      width: 250px;
      padding: 15px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      background-color: #ffffff;
    }
    h3 { margin-bottom: 10px; color: #333; }
    p { font-size: 13px; color: #666; margin-bottom: 20px; }
    
    .btn {
      background-color: #4A90E2;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      width: 100%;
      transition: background 0.3s;
    }
    .btn:hover { background-color: #357ABD; }
  </style>
</head>
<body>
  <h3>Leetcode AI Tutor</h3>
  <p>To use this extension on LeetCode, please configure your AI provider.</p>
  
  <button id="open-settings" class="btn">Open Settings</button>

  <script src="popup.js"></script>
</body>
</html>
