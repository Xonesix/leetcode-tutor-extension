<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <style>
      :root {
        --bg-color: #ffffff;
        --text-color: #333333;
        --secondary-text-color: #666666;
        --btn-bg: #f8f9fa;
        --btn-hover-bg: #e2e6ea;
        --btn-border: #ccc;
        --accent-color: #0066cc;
        --border-radius: 8px;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg-color: #1e1e1e;
          --text-color: #e0e0e0;
          --secondary-text-color: #b0b0b0;
          --btn-bg: #2d2d2d;
          --btn-hover-bg: #3d3d3d;
          --btn-border: #444;
          --accent-color: #4ea8ff;
        }
      }

      body { 
        width: 360px; 
        padding: 20px; 
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-color);
        transition: background-color 0.3s, color 0.3s;
      }
      
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
      }

      h2 {
        margin: 0;
        color: var(--text-color);
        font-weight: 600;
        font-size: 1.25rem;
      }

      .icon-btn {
        background: none;
        border: none;
        cursor: pointer;
        padding: 8px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background-color 0.2s, color 0.2s;
        color: var(--secondary-text-color);
      }

      .icon-btn span {
        display: inline-block;
        font-size: 20px;
        line-height: 1;
        transition: transform 0.3s ease;
      }

      .icon-btn:hover {
        background-color: var(--btn-hover-bg);
        color: var(--text-color);
      }

      .icon-btn:hover span {
        transform: rotate(90deg);
      }

      .icon-btn:active span {
        transform: scale(0.9) rotate(90deg);
      }

      .mode-btn { 
        width: 100%; 
        padding: 12px; 
        margin-bottom: 10px; 
        cursor: pointer; 
        border-radius: var(--border-radius); 
        border: 1px solid var(--btn-border); 
        background-color: var(--btn-bg);
        color: var(--text-color);
        font-size: 14px;
        font-weight: 500;
        transition: background-color 0.2s, border-color 0.2s, transform 0.1s;
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 10px;
      }

      .mode-btn:hover { 
        background-color: var(--btn-hover-bg); 
        border-color: var(--accent-color);
      }

      .mode-btn:active {
        transform: scale(0.98);
      }

      #output { 
        margin-top: 15px; 
        font-size: 14px; 
        white-space: pre-wrap; 
        line-height: 1.5; 
        color: var(--secondary-text-color);
        background: var(--btn-bg);
        padding: 12px;
        border-radius: var(--border-radius);
        min-height: 60px;
        border: 1px solid var(--btn-border);
        margin-bottom: 10px;
      }

      .mic-btn {
        width: 100%;
        padding: 12px;
        cursor: pointer;
        border-radius: var(--border-radius);
        border: 1px solid var(--btn-border);
        background-color: var(--btn-bg);
        color: var(--text-color);
        font-size: 14px;
        font-weight: 500;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }

      .mic-btn:hover {
        background-color: var(--btn-hover-bg);
        border-color: var(--accent-color);
      }

      .mic-btn.recording {
        background-color: #ffe0e0;
        border-color: #d33;
        color: #a00;
        animation: pulse 1.2s infinite;
      }

      @keyframes pulse {
        0%, 100% { box-shadow: 0 0 0 0 rgba(220, 50, 50, 0.4); }
        50%      { box-shadow: 0 0 0 8px rgba(220, 50, 50, 0); }
      }
    </style>
  </head>
  <body>
    <div class="header">
      <h2>LeetCoach</h2>
      <button id="open-settings" class="icon-btn" title="Settings">
        <span>&#9881;</span>
      </button>
    </div>
    
    <button id="btn-tutor" class="mode-btn">🧠 Step-by-Step Tutor</button>
    <button id="btn-interview" class="mode-btn">👔 Mock Interviewer</button>
    <button id="btn-solution" class="mode-btn">💡 Direct Solution</button>
    
    <div id="output">Waiting for action...</div>

    <button id="btn-mic" class="mic-btn">🎤 Ask by Voice</button>

    <script src="popup.js"></script>
  </body>
</html>
