<!DOCTYPE html>
<html>
<head>
  <title>Extension Settings</title>
  <style>
    :root {
      --bg-color: #f9f9f9;
      --card-bg: #ffffff;
      --text-color: #333333;
      --secondary-text-color: #666666;
      --border-color: #eeeeee;
      --input-border: #cccccc;
      --accent-color: #4A90E2;
      --accent-hover: #357ABD;
      --btn-secondary-bg: #ffffff;
      --btn-secondary-hover: #f0f7ff;
      --border-radius: 12px;
      --inner-radius: 8px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #121212;
        --card-bg: #1e1e1e;
        --text-color: #e0e0e0;
        --secondary-text-color: #b0b0b0;
        --border-color: #333333;
        --input-border: #444444;
        --accent-color: #4ea8ff;
        --accent-hover: #3a8fd9;
        --btn-secondary-bg: #2d2d2d;
        --btn-secondary-hover: #3d3d3d;
      }
    }

    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 40px 20px; 
      width: 450px; 
      margin: 0 auto;
      background-color: var(--bg-color); 
      color: var(--text-color);
      transition: background-color 0.3s, color 0.3s;
    }

    .card { 
      background-color: var(--card-bg); 
      padding: 30px; 
      border-radius: var(--border-radius); 
      box-shadow: 0 4px 20px rgba(0,0,0,0.08); 
      border: 1px solid var(--border-color);
    }

    h2 { 
      margin-top: 0; 
      color: var(--text-color); 
      font-weight: 600;
      margin-bottom: 20px;
    }

    .hidden { display: none; }
    
    /* Provider Buttons */
    .btn-group { 
      display: flex; 
      gap: 12px; 
      margin-bottom: 25px; 
    }

    .provider-btn { 
      flex: 1; 
      padding: 15px; 
      border: 2px solid var(--border-color); 
      border-radius: var(--inner-radius); 
      cursor: pointer; 
      background-color: var(--btn-secondary-bg); 
      color: var(--text-color);
      transition: all 0.2s; 
      text-align: center;
    }

    .provider-btn:hover { 
      border-color: var(--accent-color); 
      background-color: var(--btn-secondary-hover); 
    }
    
    .provider-btn b {
      display: block;
      margin-bottom: 4px;
      font-size: 14px;
    }

    /* Input Styling */
    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 500;
    }

    input { 
      width: 100%; 
      padding: 12px; 
      margin-bottom: 20px; 
      border: 1px solid var(--input-border); 
      border-radius: var(--inner-radius); 
      box-sizing: border-box; 
      background-color: var(--btn-secondary-bg);
      color: var(--text-color);
      font-size: 14px;
    }

    input:focus {
      outline: none;
      border-color: var(--accent-color);
      box-shadow: 0 0 0 2px rgba(74, 144, 226, 0.2);
    }

    button#save { 
      width: 100%; 
      padding: 12px; 
      background-color: var(--accent-color); 
      color: white; 
      border: none; 
      border-radius: var(--inner-radius); 
      cursor: pointer; 
      font-size: 15px;
      font-weight: 600;
      transition: background-color 0.2s;
    }

    button#save:hover { 
      background-color: var(--accent-hover); 
    }

    .back-link { 
      display: inline-block;
      margin-bottom: 15px;
      font-size: 13px; 
      color: var(--secondary-text-color); 
      cursor: pointer; 
      text-decoration: none; 
      transition: color 0.2s;
    }

    .back-link:hover {
      color: var(--accent-color);
    }

    #help-text {
      font-size: 13px;
      color: var(--secondary-text-color);
      margin-bottom: 20px;
      line-height: 1.4;
    }

    #status {
      margin-top: 15px; 
      font-size: 12px; 
      text-align: center;
      min-height: 18px;
    }
  </style>
</head>
<body>

  <div class="card">
    <div id="step-1">
      <h2>Choose Provider</h2>
      <div class="btn-group">
        <button class="provider-btn" data-provider="gemini"><b>Google</b><br>Gemini</button>
        <button class="provider-btn" data-provider="claude"><b>Anthropic</b><br>Claude</button>
        <button class="provider-btn" data-provider="openai"><b>OpenAI</b><br>Voice</button>
      </div>
    </div>

    <div id="step-2" class="hidden">
      <span class="back-link" id="back-btn">← Back</span>
      <h2 id="provider-title">API Settings</h2>
      <p id="help-text"></p>
      
      <label for="api-key">Enter your API Key:</label>
      <input type="password" id="api-key" placeholder="sk-...">
      
      <button id="save">Save Configuration</button>
    </div>
    
    <div id="status"></div>
  </div>

  <script src="options.js"></script>
</body>
</html>
